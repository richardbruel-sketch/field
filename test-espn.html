<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test ESPN</title>
<style>body{font:15px/1.5 system-ui,sans-serif;background:#000;color:#fff;margin:0;padding:16px;max-width:640px;margin:auto}input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #444;background:#111;color:#fff;width:100%;margin:6px 0}button{background:#F9CD54;color:#000;font-weight:700;border-color:#F9CD54}pre{white-space:pre-wrap;word-break:break-word;background:#111;padding:10px;border-radius:10px;font-size:12px}</style></head>
<body>
<h1>Test ESPN</h1>
<p>Montre ce qu'ESPN fournit pour un match : commentaire, événements clés, compositions.</p>
<label for="lg">Compétition (code ESPN)</label><input id="lg" value="fra.1">
<label for="ev">Identifiant du match</label><input id="ev" value="401876447">
<button id="b1">Tester le résumé du match</button>
<button id="b2">Tester la F1</button>
<pre id="o">Aucun test lancé.</pre>
<script>
var o=document.getElementById("o");
function res(j){var l=[];Object.keys(j).forEach(function(k){var v=j[k];l.push(k+" : "+(Array.isArray(v)?"liste de "+v.length:v&&typeof v=="object"?"objet ("+Object.keys(v).length+" champs)":String(v).slice(0,40)))});if(Array.isArray(j.events))l.push("\nÉvénements :\n"+j.events.slice(0,6).map(function(e){return"- "+e.name+" ("+e.date+")"}).join("\n"));return l.join("\n")}
function ech(j){var t="";["commentary","keyEvents","rosters","plays"].forEach(function(k){var v=j[k];if(Array.isArray(v)&&v.length)t+="\n\n== "+k+" (extrait) ==\n"+JSON.stringify(v.slice(0,2),null,1).slice(0,900)});return t}
function go(u){o.textContent="Chargement…";fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(j){o.textContent="Adresse : "+u+"\n\nChamps reçus :\n"+res(j)+ech(j)}).catch(function(e){o.textContent="Échec : "+e.message+"\n(« Failed to fetch » veut dire que le navigateur bloque l'accès depuis ce site.)"})}
document.getElementById("b1").onclick=function(){go("https://site.api.espn.com/apis/site/v2/sports/soccer/"+encodeURIComponent(document.getElementById("lg").value.trim())+"/summary?event="+encodeURIComponent(document.getElementById("ev").value.trim()))};
document.getElementById("b2").onclick=function(){go("https://site.api.espn.com/apis/site/v2/sports/racing/f1/scoreboard")};
</script></body></html>
